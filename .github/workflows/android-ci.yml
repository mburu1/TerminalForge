name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # Temporary bootstrap until generated wrapper files are committed.
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.14.3 --distribution-type bin
      - name: Verify wrapper
        run: ./gradlew --no-daemon --version
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminalforge-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terminalforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
